# Course website, built with Quarto (https://quarto.org) and deployed to GitHub Pages
# by .github/workflows/publish.yml. Preview locally with `quarto preview`.
project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - 404.qmd
    - notebooks/*.ipynb
  resources:
    - presentations/old/*.pdf

# Notebooks are rendered with the outputs saved in them; nothing is re-executed.
execute:
  enabled: false

website:
  title: "Math. Foundations of Control & ML"
  site-url: https://cml-fau.github.io/
  repo-url: https://github.com/cml-fau/cml-fau.github.io
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    right:
      - icon: github
        href: https://github.com/cml-fau/cml-fau.github.io
        aria-label: GitHub repository
  sidebar:
    style: docked
    search: true
    collapse-level: 1
    contents:
      - text: Home
        href: index.qmd
      - section: Notebooks
        contents: notebooks/*.ipynb
  page-footer:
    center: "FAU Erlangen-Nürnberg · Winter 2026"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: false
    code-tools: true
    code-copy: true
    html-math-method: mathjax
