# Course website, built with Quarto (https://quarto.org) and deployed to GitHub Pages
# by .github/workflows/publish.yml. Preview locally with `quarto preview`.
project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - 404.qmd
    - presentations/topics.qmd
    - presentations/schedule.qmd
    - notebooks/*.ipynb
  resources:
    - presentations/old/*.pdf
    - lectures/*/*.pdf
    - lectures/*/videos/*.mp4
    - favicon.ico
    # iOS home-screen icon and link-preview card; sources are the .svg files next to them
    - apple-touch-icon.png
    - social-card.png
    # Google Search Console ownership check; must stay at the site root, unchanged.
    - google71a06efc573aa717.html

# Notebooks are rendered with the outputs saved in them; nothing is re-executed.
execute:
  enabled: false

website:
  title: "Mathematical Foundations of Control and Machine Learning"
  description: "Master's course at FAU Erlangen-Nürnberg (Winter 2026/27) by Prof. Enrique Zuazua: a unified mathematical view of control theory and machine learning, with lecture slides and Python/PyTorch notebooks."
  site-url: https://cml-fau.github.io/
  # Browser-tab icon: a sigmoid on the theme's blue tile. favicon.ico is the fallback for browsers
  # and crawlers that request /favicon.ico directly; after editing favicon.svg, rebuild it with
  # `convert -background none -density 1536 favicon.svg -define icon:auto-resize=48,32,16 favicon.ico`
  favicon: favicon.svg
  # Link previews when the site is shared (Open Graph / Twitter cards). social-card.png is the
  # default preview image; after editing social-card.svg, rebuild it with
  # `uvx cairosvg social-card.svg -o social-card.png` (same for apple-touch-icon.svg).
  image: social-card.png
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  # Writes llms.txt and a Markdown copy of every page (*.llms.md) for LLM tools.
  llms-txt: true
  repo-url: https://github.com/cml-fau/cml-fau.github.io
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    right:
      - icon: github
        href: https://github.com/cml-fau/cml-fau.github.io
        aria-label: GitHub repository
  sidebar:
    style: docked
    search: true
    collapse-level: 1
    contents:
      - text: Home
        href: index.qmd
      - section: Lectures
        contents:
          - section: "00 · Introduction to Control and Machine Learning"
            contents:
              - text: PDF
                href: lectures/00_introduction_control_and_machine_learning/introduction_control_and_machine_learning.pdf
              - text: PowerPoint
                href: https://drive.google.com/file/d/1iTSIfdrd_4o3Lwf-c-V_9y__BtAXT8Vc/view
          - text: "01 · Introduction to Control Theory"
            href: lectures/01_introduction_control_theory/introduction_control_theory.pdf
          - text: "02 · Universal Approximation and Optimization"
            href: lectures/02_universal_approximation_and_optimization/universal_approximation_and_optimization.pdf
          - text: "03 · The Training Loop"
            href: lectures/03_the_training_loop/the_training_loop.pdf
          - text: "04 · The Training Loop II"
            href: lectures/04_the_training_loop_ii/the_training_loop_ii.pdf
          - text: "05 · Self-Attention and Transformers"
            href: lectures/05_self_attention_and_transformers/self_attention_and_transformers.pdf
      - section: Notebooks
        contents: notebooks/*.ipynb
  page-footer:
    center: "FAU Erlangen-Nürnberg · Winter 2026/27"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: false
    code-tools: true
    code-copy: true
    html-math-method: mathjax
    # Google Tag Manager container GTM-KW97DGFF (Google's standard loader), loaded on every page. Analytics itself (e.g. a GA4 Google tag) is configured inside the
    # GTM container, not here.
    include-in-header:
      text: |
        <link rel="apple-touch-icon" href="/apple-touch-icon.png">
        <script>
        (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
        new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer','GTM-KW97DGFF');
        </script>
