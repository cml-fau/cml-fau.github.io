# Course website, built with Quarto (https://quarto.org) and deployed to GitHub Pages
# by .github/workflows/publish.yml. Preview locally with `quarto preview`.
project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - 404.qmd
    - presentations/topics.qmd
    - presentations/schedule.qmd
    - notebooks/*.ipynb
  resources:
    - presentations/old/*.pdf
    - lectures/*/*.pdf
    - lectures/*/videos/*.mp4

# Notebooks are rendered with the outputs saved in them; nothing is re-executed.
execute:
  enabled: false

website:
  title: "Math. Foundations of Control & ML"
  site-url: https://cml-fau.github.io/
  repo-url: https://github.com/cml-fau/cml-fau.github.io
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    right:
      - icon: github
        href: https://github.com/cml-fau/cml-fau.github.io
        aria-label: GitHub repository
  sidebar:
    style: docked
    search: true
    collapse-level: 1
    contents:
      - text: Home
        href: index.qmd
      - section: Lectures
        contents:
          - section: "00 · Introduction to Control and Machine Learning"
            contents:
              - text: PDF
                href: lectures/00_introduction_control_and_machine_learning/introduction_control_and_machine_learning.pdf
              - text: PowerPoint
                href: https://drive.google.com/file/d/1iTSIfdrd_4o3Lwf-c-V_9y__BtAXT8Vc/view
          - text: "01 · Introduction to Control Theory"
            href: lectures/01_introduction_control_theory/introduction_control_theory.pdf
      - section: Notebooks
        contents: notebooks/*.ipynb
  page-footer:
    center: "FAU Erlangen-Nürnberg · Winter 2026"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: false
    code-tools: true
    code-copy: true
    html-math-method: mathjax
